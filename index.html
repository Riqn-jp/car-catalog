<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Catalog</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --bg-color: #f8f8f6;
      --card-bg: #ffffff;
      --primary: #2d3748;
      --accent: #6b7c96;
      --accent-soft: #edf2f7;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #e2e8f0;
      --star-color: #f59e0b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Kaku Gothic New', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px 80px 20px;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ヘッダーエリア */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'Plus Jakarta Sans', 'Zen Kaku Gothic New', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* コントロールエリア */
    .controls-wrapper {
      max-width: 1000px;
      margin: 0 auto 28px auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-sort-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 2;
      min-width: 200px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .sort-select {
      flex: 1;
      min-width: 150px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .search-input:focus, .sort-select:focus {
      border-color: var(--accent);
      background-color: #ffffff;
    }

    /* 車両追加トグルボタン */
    .btn-toggle-form {
      padding: 10px 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-toggle-form:hover {
      opacity: 0.9;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 4px;
    }

    .filter-btn {
      background-color: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .filter-btn.fav-btn {
      border-color: #fef3c7;
      background-color: #fffbeb;
      color: #d97706;
    }

    .filter-btn.fav-btn:hover, .filter-btn.fav-btn.active {
      background-color: #f59e0b;
      border-color: #f59e0b;
      color: #ffffff;
    }

    /* 追加フォーム */
    .add-form-container {
      max-width: 1000px;
      margin: 0 auto 28px auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      display: none;
    }

    .add-form-container.open {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      background-color: #ffffff;
    }

    .form-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-submit {
      flex: 3;
      padding: 10px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-close-form {
      flex: 1;
      padding: 10px;
      background: #edf2f7;
      color: var(--text-sub);
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn-close-form:hover {
      background: #e2e8f0;
    }

    /* カタログ情報バー */
    .catalog-meta {
      max-width: 1000px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* カタログのレイアウト */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 車のカードデザイン */
    .car-card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .car-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
    }

    .btn-fav-star {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      color: #cbd5e0;
      font-size: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 2;
    }

    .btn-fav-star.active {
      color: var(--star-color);
      background: #ffffff;
    }

    .car-img-container {
      width: 100%;
      height: 180px;
      background-color: #edf2f7;
      overflow: hidden;
    }

    .car-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .car-card:hover img {
      transform: scale(1.03);
    }

    .car-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .car-brand {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      background-color: var(--accent-soft);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .car-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .car-price {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-delete {
      background-color: transparent;
      color: var(--text-sub);
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      color: #e53e3e;
      background-color: #fff5f5;
    }
  </style>
</head>
<body>

  <header>
    <h1>Vehicle Catalog</h1>
  </header>

  <!-- コントロールエリア -->
  <div class="controls-wrapper">
    <div class="search-sort-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="検索: 車名、メーカー名..." oninput="applyFilters()">
     
      <select id="sortSelect" class="sort-select" onchange="applyFilters()">
        <option value="default">登録順</option>
        <option value="price-asc">価格が安い順</option>
        <option value="price-desc">価格が高い順</option>
        <option value="name-asc">名前順 (A-Z)</option>
      </select>

      <button class="btn-toggle-form" onclick="toggleForm()">＋ 車両を追加</button>
    </div>

    <div id="filterContainer" class="filter-buttons"></div>
  </div>

  <!-- 車追加フォーム -->
  <section id="addFormContainer" class="add-form-container">
    <form id="addCarForm">
      <div class="form-grid">
        <div class="form-group">
          <input type="text" id="carBrand" placeholder="メーカー (例: Pegassi)" list="brandList" required>
          <datalist id="brandList"></datalist>
        </div>
        <div class="form-group">
          <input type="text" id="carName" placeholder="車種名 (例: Zentorno)" required>
        </div>
        <div class="form-group">
          <input type="number" id="carPrice" placeholder="価格 ($)" required>
        </div>
        <div class="form-group">
          <input type="text" id="carImage" placeholder="画像URL (任意)">
        </div>
      </div>
      <div class="form-buttons">
        <button type="submit" class="btn-submit">登録する</button>
        <button type="button" class="btn-close-form" onclick="toggleForm()">閉じる</button>
      </div>
    </form>
  </section>

  <!-- メタ情報 (件数) -->
  <div class="catalog-meta">
    <span>表示件数: <strong id="carCount">0</strong> 台</span>
  </div>

  <!-- メインカタログ表示 -->
  <main>
    <div id="catalog" class="catalog-grid"></div>
  </main>

  <script>
    const initialCars = [
      { id: 1, brand: "Grotti", name: "Itali RSX", price: 3465000, image: "https://via.placeholder.com/300x180/e2e8f0/475569?text=Itali+RSX", isFavorite: false },
      { id: 2, brand: "Pegassi", name: "Zentorno", price: 725000, image: "https://via.placeholder.com/300x180/e2e8f0/475569?text=Zentorno", isFavorite: true },
      { id: 3, brand: "Pfister", name: "Comet S2", price: 1878000, image: "https://via.placeholder.com/300x180/e2e8f0/475569?text=Comet+S2", isFavorite: false }
    ];

    let cars = JSON.parse(localStorage.getItem('fivem_vehicle_catalog_cute')) || initialCars;
    let currentBrand = 'all';

    function saveCatalog() {
      localStorage.setItem('fivem_vehicle_catalog_cute', JSON.stringify(cars));
    }

    function toggleForm() {
      const container = document.getElementById("addFormContainer");
      container.classList.toggle("open");
      if (container.classList.contains("open")) {
        document.getElementById("carBrand").focus();
      }
    }

    function updateBrandFilters() {
      const filterContainer = document.getElementById("filterContainer");
      const brandList = document.getElementById("brandList");
     
      const brands = [...new Set(cars.map(car => car.brand.trim()))].filter(Boolean);

      filterContainer.innerHTML = `
        <button class="filter-btn ${currentBrand === 'all' ? 'active' : ''}" onclick="filterByBrand('all')">すべて</button>
        <button class="filter-btn fav-btn ${currentBrand === 'favorites' ? 'active' : ''}" onclick="filterByBrand('favorites')">★ お気に入り</button>
      `;
     
      brands.forEach(brand => {
        const isActive = currentBrand === brand ? 'active' : '';
        const btn = document.createElement("button");
        btn.className = `filter-btn ${isActive}`;
        btn.textContent = brand;
        btn.onclick = () => filterByBrand(brand);
        filterContainer.appendChild(btn);
      });

      brandList.innerHTML = brands.map(brand => `<option value="${brand}">`).join('');
    }

    function filterByBrand(brand) {
      currentBrand = brand;
      updateBrandFilters();
      applyFilters();
    }

    function applyFilters() {
      const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
      const sortValue = document.getElementById("sortSelect").value;

      let result = [...cars];

      if (currentBrand === 'favorites') {
        result = result.filter(car => car.isFavorite);
      } else if (currentBrand !== 'all') {
        result = result.filter(car => car.brand.toLowerCase() === currentBrand.toLowerCase());
      }

      if (searchQuery) {
        result = result.filter(car =>
          car.name.toLowerCase().includes(searchQuery) ||
          car.brand.toLowerCase().includes(searchQuery)
        );
      }

      if (sortValue === 'price-asc') {
        result.sort((a, b) => a.price - b.price);
      } else if (sortValue === 'price-desc') {
        result.sort((a, b) => b.price - a.price);
      } else if (sortValue === 'name-asc') {
        result.sort((a, b) => a.name.localeCompare(b.name));
      }

      document.getElementById("carCount").textContent = result.length;
      displayCatalog(result);
    }

    function displayCatalog(carList) {
      const catalogContainer = document.getElementById("catalog");
      catalogContainer.innerHTML = "";

      if (carList.length === 0) {
        catalogContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-sub);">該当するお車が見つかりませんでした</div>`;
        return;
      }

      carList.forEach(car => {
        const formattedPrice = "$" + Number(car.price).toLocaleString();
        const favClass = car.isFavorite ? 'active' : '';

        const carCard = document.createElement("div");
        carCard.className = "car-card";
        carCard.innerHTML = `
          <button class="btn-fav-star ${favClass}" onclick="toggleFavorite(${car.id})" title="お気に入り">★</button>
          <div class="car-img-container">
            <img src="${car.image || 'https://via.placeholder.com/300x180/e2e8f0/475569?text=No+Image'}" alt="${car.name}">
          </div>
          <div class="car-info">
            <span class="car-brand">${car.brand}</span>
            <h2 class="car-name">${car.name}</h2>

            <div class="card-footer">
              <div class="car-price">${formattedPrice}</div>
              <button class="btn-delete" onclick="deleteCar(${car.id})">削除</button>
            </div>
          </div>
        `;
        catalogContainer.appendChild(carCard);
      });
    }

    function toggleFavorite(id) {
      const car = cars.find(c => c.id === id);
      if (car) {
        car.isFavorite = !car.isFavorite;
        saveCatalog();
        applyFilters();
      }
    }

    document.getElementById("addCarForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const brandInput = document.getElementById("carBrand");
      const brand = brandInput.value.trim();
      const name = document.getElementById("carName").value.trim();
      const price = Number(document.getElementById("carPrice").value);
      let image = document.getElementById("carImage").value.trim();

      if (!image) {
        image = `https://via.placeholder.com/300x180/e2e8f0/475569?text=${encodeURIComponent(brand + ' ' + name)}`;
      }

      const newCar = {
        id: Date.now(),
        brand,
        name,
        price,
        image,
        isFavorite: false
      };

      cars.push(newCar);
      saveCatalog();
     
      updateBrandFilters();
      applyFilters();

      this.reset();
      brandInput.focus();
    });

    function deleteCar(id) {
      if (confirm("この車両を削除してもよろしいですか？")) {
        cars = cars.filter(car => car.id !== id);
        saveCatalog();
       
        if (currentBrand !== 'all' && currentBrand !== 'favorites' && !cars.some(car => car.brand === currentBrand)) {
          currentBrand = 'all';
        }
        updateBrandFilters();
        applyFilters();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateBrandFilters();
      applyFilters();
    });
  </script>
</body>
</html>
